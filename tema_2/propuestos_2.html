<body>
    <header>
        <a class="back" href="index.html">← Volver al <span class="tema-actual">Tema 2</span></a>
    </header>

    <h1>Propuestos 2</h1>

    <label for="num">Introduce un numero:</label>
    <input type="number" id="num">
    <button onclick="comprobarEdad()">Comprobar</button>
    <p id="resultado"></p>
    <br>
    <p>comprobacion: <code>var mensaje = (num % 2 == 0) ? "El numero es par" : "El numero es impar";</code></p>

    <script>

        function comprobarEdad() {
            var num = parseInt(document.getElementById("num").value);
            var mensaje = (num % 2 == 0) ? "El numero es par" : "El numero es impar";
            document.getElementById("resultado").innerHTML = mensaje;
        }

    </script>

</body>
