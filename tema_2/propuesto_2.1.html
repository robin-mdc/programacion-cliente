    <h1>Actividad propuesta 2.1</h1>

    <p>a=15, b=5</p>

    <button onclick="resultados()">ejecutar operaciones (consola)</button>

    <script>

        var a = 15;
        var b = 5;

        function resta(a, b) {
            return a - b;
        }
        function mult(a, b) {
            return a * b;
        }
        function division(a, b) {
            return a / b;
        }

        function resultados() {
            console.log("resta:", resta(a, b))
            console.log("multiplicacion:", mult(a, b))
            console.log("division:", division(a, b))
        }

    </script>
