    <p id="resultado1"></p>
    <p id="resultado2"></p>
    <p>Ambas dan NaN porque Number() solo convierte cadenas que representen un número válido</p>
    <p>"9 9" tiene un espacio en medio y "dos" es texto, asi que no se pueden convertir</p>

    <script>
        document.getElementById("resultado1").innerHTML = 'Number("9 9") = ' + Number("9 9");
        document.getElementById("resultado2").innerHTML = 'Number("dos") = ' + Number("dos");
    </script>
