    <p id="fecha"></p>
    <p id="mes"></p>
    <p id="año"></p>

        // los meses empiezan en 0
        var fecha = new Date(2026, 2, 15);

        document.getElementById("fecha").innerHTML = "Fecha: 15/03/2026";
