<body>

    </header>

    <h1>Propuestos 9</h1>
    <p>Si se puede crear. Un array puede mezclar tipos de datos y contener otros arrays</p>
    <p id="pos"></p>

    <h2>Contenido de milista</h2>
    <ul id="lista"></ul>

    <script>

        var milista = ['panadero', 456, [0, 1, 2]];

        document.getElementById("pos").innerHTML = "milista[2][2] = " + milista[2][2];

        var salida = document.getElementById("lista");
        for (var i = 0; i < milista.length; i++) {
            if (Array.isArray(milista[i])) {
                salida.innerHTML += "<li>Posición " + i + ": array con los valores " + milista[i].join(", ") + "</li>";
            } else {
                salida.innerHTML += "<li>Posición " + i + ": " + milista[i] + "</li>";
            }
        }

    </script>
</body>
