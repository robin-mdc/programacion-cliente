    <p>Variables:<br>
        <code>var texto = "Hola";<br>
        var numero = 25;<br>
        var decimal = 3.14;<br>
        var booleano = true;<br>
        var nulo = null;</code>

    <p>Tipos:</p>
    <ul id="lista"></ul>

    <script>
        var texto = "Hola";
        var numero = 25;
        var decimal = 3.14;
        var booleano = true;
        var nulo = null;

        var salida = document.getElementById("lista");
        salida.innerHTML += "<li>typeof texto: " + typeof texto + "</li>";
        salida.innerHTML += "<li>typeof numero: " + typeof numero + "</li>";
        salida.innerHTML += "<li>typeof decimal: " + typeof decimal + "</li>";
        salida.innerHTML += "<li>typeof booleano: " + typeof booleano + "</li>";
        salida.innerHTML += "<li>typeof nulo: " + typeof nulo + "</li>";
    </script>
