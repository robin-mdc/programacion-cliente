<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWEC TEMA 3</title>
    <link rel="icon" href="../assets/icons/smiley.png">
    <link rel="stylesheet" href="../style.css">
    <meta name="description" content="ejercicio del tema 3">
    <meta name="author" content="Robin Jack">
</head>
<body>
    <header>
        <a class="back" href="index.html">← Volver al <span class="tema-actual">Tema 3</span></a>
    </header>

    <main>
        <h1>Practica con el tiempo</h1>

        <section>
            <h2>1 Fecha en castellano</h2>
            <p id="fecha"></p>
        </section>

        <section>
            <h2>2 ¿Cuántos días faltan?</h2>
            <p id="dias"></p>
        </section>

        <section>
            <h2>3 Reloj con pausa</h2>
            <p id="reloj"></p>
            <button id="parar">Parar</button>
            <button id="reanudar">Reanudar</button>
        </section>
    </main>

    <script>
        // ej 1
        const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
        const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
                       "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

        const hoy = new Date();
        const fechaTexto = dias[hoy.getDay()] + ", " + hoy.getDate() + " de " +
                           meses[hoy.getMonth()] + " de " + hoy.getFullYear();

        console.log(fechaTexto);
        document.getElementById("fecha").textContent = fechaTexto;


        // ej 2
        const diasHasta = fecha => Math.ceil((fecha - new Date()) / 86400000);

        const cumple = new Date(2027, 6, 24);
        const faltan = diasHasta(cumple);

        console.log("Faltan " + faltan + " días para mi cumpleaños");
        document.getElementById("dias").textContent =
            "Faltan " + faltan + " días para mi cumpleaños (" + cumple.toLocaleDateString("es-ES") + ")";


        // ej 3
        const reloj = document.getElementById("reloj");
        let id = null;

        const mostrarHora = () => {
            reloj.textContent = new Date().toLocaleTimeString("es-ES");
        };

        const arrancar = () => {
            if (id === null) {     // para noc rear dos a la vez
                mostrarHora();
                id = setInterval(mostrarHora, 1000);
            }
        };

        const parar = () => {
            clearInterval(id);
            id = null;
        };

        document.getElementById("parar").onclick = parar;
        document.getElementById("reanudar").onclick = arrancar;

        arrancar();
    </script>
</body>
</html>
