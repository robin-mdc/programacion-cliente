    <main>

        <h1>Inventario</h1>

    </main>
    <script>
        class Producto {
            constructor(nombre, precio, stock) {
                this.nombre = nombre;
                this.precio = precio;
                this.stock = stock;
            }
        }

        const inventario = [
            new Producto("Teclado", 50, 10),
            new Producto("Ayoub", 350, 3),
            new Producto("Monitor", 200, 4),
            new Producto("Cascos", 35, 8)
        ];

        let total = 0;
        for (const producto of inventario) {
            if (producto.stock < 5) {
                console.log(producto.nombre, producto.stock);
            }
            total += producto.precio * producto.stock;
        }
        console.log("Valor total:", total);

    </script>
