    <script>
        class Libro {
            constructor(titulo, autor, paginas) {
                this.titulo = titulo;
                this.autor = autor;
                this.paginas = paginas;
            }
            resumen () { return `${this.titulo}, de ${this.autor} (${this.paginas} páginas)`}
        }

        }
        console.log(bla.resumen());
