        <h1>Clase producto</h1>

    </main>

    <script>
        class Producto {
            constructor(nombre, precio, stock) {
                this.nombre = nombre;
                this.precio = precio;
                this.stock = stock;
            }
            conIVA() { return this.precio * 1.21 }
            vender(n) {
                if (n <= this.stock) {
                    this.stock -= n;
                    return true;
                }
                return false;
            }
        }

        const teclado = new Producto("Teclado", 50, 10);
        console.log(teclado.conIVA());
        console.log(teclado.vender(3), teclado.stock);
        console.log(teclado.vender(20), teclado.stock);

    </script>
