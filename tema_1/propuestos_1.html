<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWEC tema_1</title>
    <link rel="icon" href="../assets/icons/smiley.png">
    <meta name="description" content="ejercicio del tema_1">
    <meta name="author" content="Robin Jack">

    <script>

        /**
         * Writes the text "Hello world!" directly into the document.
         * document.write() replaces the whole page content.
         *
         * @returns {void}
         */
        function sayHello() {
            document.write("Hello world!")
        }

        /**
         * Replaces the content of the heading with id "titulo" by a bold text.
         * Triggered by the onclick event of the "Cambiar titulo" button.
         *
         * @returns {void}
         */
        function modificarTexto() {
            document.getElementById("titulo").innerHTML =
                "<strong>Modificando el contenido</strong>";
        }

    </script>

</head>
<body>
    <header>
        <a class="back" href="index.html">← Volver al <span class="tema-actual">Tema 1</span></a>
    </header>
    
    <h1 id="titulo">Título Original</h1>
    <br>
    <button onclick="modificarTexto()">
        Cambiar titulo
    </button>

</body>
</html>
